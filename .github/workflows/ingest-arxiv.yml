name: Ingest arXiv

on:
  workflow_dispatch:
    inputs:
      lookback_hours:
        description: Hours to look back
        required: false
        default: "72"
      max_results_per_query:
        description: Safety cap for each arXiv query
        required: false
        default: "300"
      max_sol_stories:
        description: Maximum papers sent to GPT-5.6 Sol
        required: false
        default: "1"
  schedule:
    - cron: "17 0 * * *"
      timezone: "America/New_York"

concurrency:
  group: ingest-arxiv
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
      OPENAI_FAST_MODEL: gpt-5.6-luna
      OPENAI_DEEP_MODEL: gpt-5.6-sol
      OPENAI_FAST_REASONING_EFFORT: none
      OPENAI_DEEP_REASONING_EFFORT: medium
      ARXIV_LOOKBACK_HOURS: ${{ inputs.lookback_hours || '72' }}
      ARXIV_MAX_RESULTS_PER_QUERY: ${{ inputs.max_results_per_query || '300' }}
      ARXIV_DISCOVERY_MODE: rss
      BIORXIV_MAX_RESULTS: "300"
      MAX_SOL_STORIES_PER_DAY: ${{ inputs.max_sol_stories || '6' }}
      PROCESS_MAX_PAPERS: "60"
      PIPELINE_TRIGGER: ${{ github.event_name }}
      PYTHONPATH: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install pipeline dependencies
        run: python -m pip install --requirement backend/requirements.txt
      - name: Fetch and store recent papers
        run: python -m bioai_pipeline.cli ingest-arxiv
      - name: Fetch and store recent bioRxiv papers
        run: python -m bioai_pipeline.cli ingest-biorxiv
      - name: Enrich and publish stories
        run: python -m bioai_pipeline.cli process-stories
