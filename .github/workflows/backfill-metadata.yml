name: Backfill verified metadata

on:
  workflow_dispatch:
    inputs:
      limit:
        description: Maximum published stories to enrich
        required: false
        default: "100"
  push:
    branches: [main]
    paths:
      - .github/workflows/backfill-metadata.yml

permissions:
  contents: read

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
      PYTHONPATH: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install pipeline dependencies
        run: python -m pip install --requirement backend/requirements.txt
      - name: Refresh author and institution metadata
        run: python -m bioai_pipeline.cli backfill-metadata --limit ${{ inputs.limit || '100' }}
