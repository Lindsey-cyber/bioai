name: Backfill English explanations

on:
  workflow_dispatch:
    inputs:
      limit:
        description: Maximum stories to translate
        required: false
        default: "50"
  push:
    branches: [main]
    paths:
      - .github/workflows/backfill-english.yml

permissions:
  contents: read

jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_FAST_MODEL: gpt-5.6-luna
      OPENAI_FAST_REASONING_EFFORT: none
      PYTHONPATH: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install pipeline dependencies
        run: python -m pip install --requirement backend/requirements.txt
      - name: Translate existing Chinese explanations
        run: python -m bioai_pipeline.cli backfill-english --limit ${{ inputs.limit || '50' }}
